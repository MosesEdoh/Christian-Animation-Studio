kind = "mobile"
previewPath = "/frame-faith-mobile/"
title = "Frame & Faith Mobile"
description = "A mobile companion for the Frame & Faith animation studio. Review the three-episode season, read scripts and storyboards, and preview generated clips on a phone."
version = "1.0.0"
id = "artifacts/frame-faith-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/frame-faith-mobile/" ]
localPort = 18165

[services.development]
run = "pnpm --filter @workspace/frame-faith-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frame-faith-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/frame-faith-mobile", "run", "serve" ]

[services.env]
PORT = "18165"
BASE_PATH = "/frame-faith-mobile/"
