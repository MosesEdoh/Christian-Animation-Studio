kind = "web"
previewPath = "/"
title = "Creative Studio"
description = "A private creative studio for planning, writing, directing, storyboarding, and generating a faith-forward animated action series for young audiences."
version = "1.0.0"
id = "artifacts/creative-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23522

[services.development]
run = "pnpm --filter @workspace/creative-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/creative-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/creative-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23522"
BASE_PATH = "/"
