openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: studio
    description: Creative studio workspace
  - name: ai
    description: AI-assisted writing and directing
  - name: auth
    description: Browser and mobile authentication
  - name: storage
    description: Persistent studio asset uploads
paths:
  /studio/exports:
    get:
      operationId: listStudioExports
      tags: [studio]
      description: Movies ordered by descending ID. Request older pages using beforeId set to the last returned ID. A page shorter than limit means the end of history; a full page may be followed by an empty page. ID cursors remain valid after deletion.
      parameters:
        - in: query
          name: beforeId
          description: Return only movies with IDs less than this exclusive cursor.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Saved storyboard movie exports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudioExport" }
        "400":
          description: Invalid page size or cursor
    post:
      operationId: createStudioExport
      tags: [studio]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudioExportInput" }
      responses:
        "202":
          description: Queued storyboard movie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioExport" }
  /studio/exports/preflight:
    get:
      operationId: preflightStudioExport
      tags: [studio]
      parameters:
        - in: query
          name: episodeId
          schema: { type: integer, minimum: 1 }
          description: Omit to check the entire series.
        - in: query
          name: aspectRatio
          required: true
          schema: { type: string, enum: ["16:9", "9:16"] }
      responses:
        "200":
          description: Bounded estimate of saved scripts; rendering still enforces all limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioExportPreflight" }
        "400":
          description: Invalid selection
        "404":
          description: Episode not found
        "503":
          description: Estimate temporarily unavailable
  /studio/exports/{id}:
    delete:
      operationId: deleteStudioExport
      tags: [studio]
      summary: Permanently delete a finished storyboard movie and its history
      description: Requires approved studio access. Deletes ready, failed, or cancelled exports only. Deletes the stored MP4 before history; storage errors retain history for retry. A missing object or already removed export is a successful no-op.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "204":
          description: Movie and history removed, or already absent
        "400":
          description: Invalid movie ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Sign-in required
        "403":
          description: Studio access required
        "409":
          description: Active movies must be cancelled, not deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: Storage deletion failed; history retained for retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /studio/exports/{id}/cancel:
    post:
      operationId: cancelStudioExport
      tags: [studio]
      summary: Cancel a queued or rendering storyboard movie
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelled movie (also returned for repeated cancellation)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioExport" }
        "400":
          description: Invalid movie ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Movie not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: A ready or failed movie cannot be cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /studio/exports/{id}/file:
    get:
      operationId: downloadStudioExport
      tags: [studio]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Protected MP4
          content:
            video/mp4:
              schema: { type: string, format: binary }
  /studio/episodes/{id}/video:
    get:
      operationId: downloadStudioEpisodeVideo
      tags: [studio]
      summary: Assemble downloadable provider clips into one episode MP4
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Assembled episode MP4; skipped clip details are base64 JSON in X-Episode-Video-Report
          headers:
            X-Episode-Video-Report:
              schema: { type: string }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "422":
          description: No usable clips are available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeVideoUnavailable" }
        "503":
          description: Episode export capacity is full; no work was queued
          headers:
            Retry-After:
              description: Suggested delay in seconds before a manual retry
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                type: object
                required: [error, code, retryAfterSeconds]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [EPISODE_EXPORT_BUSY] }
                  retryAfterSeconds: { type: integer, minimum: 1 }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private App Storage upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          description: Sign in is required to upload assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /studio/bootstrap:
    get:
      operationId: getStudioBootstrap
      tags: [studio]
      summary: Load the studio workspace
      responses:
        "200":
          description: Studio workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioBootstrap"
  /studio/assets:
    post:
      operationId: createStudioAsset
      tags: [studio]
      summary: Save metadata for an uploaded reference asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioAssetInput"
      responses:
        "201":
          description: Saved reference asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioAsset"
  /studio/project:
    patch:
      operationId: updateStudioProject
      tags: [studio]
      summary: Update the active project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /studio/characters:
    post:
      operationId: createStudioCharacter
      tags: [studio]
      summary: Create a character bible entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
  /studio/characters/{id}:
    patch:
      operationId: updateStudioCharacter
      tags: [studio]
      summary: Update a character bible entry
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
  /studio/scenes:
    post:
      operationId: createStudioScene
      tags: [studio]
      summary: Add a scene to an episode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "201":
          description: Created scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /studio/scenes/{id}:
    patch:
      operationId: updateStudioScene
      tags: [studio]
      summary: Save a scene draft
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneUpdate"
      responses:
        "200":
          description: Updated scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /studio/shots:
    post:
      operationId: createStudioShot
      tags: [studio]
      summary: Add a shot to a storyboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotInput"
      responses:
        "201":
          description: Added storyboard shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
  /studio/shots/{id}:
    patch:
      operationId: updateStudioShot
      tags: [studio]
      summary: Edit a storyboard shot
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotUpdate"
      responses:
        "200":
          description: Updated storyboard shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
  /studio/shots/reorder:
    patch:
      operationId: reorderStudioShots
      tags: [studio]
      summary: Save the storyboard order for a scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotOrderInput"
      responses:
        "200":
          description: Reordered storyboard shots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shot"
  /studio/episodes/{id}/complete:
    post:
      operationId: completeStudioEpisode
      tags: [studio]
      summary: Generate and save a complete episode script and storyboard
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeCompletionInput"
      responses:
        "200":
          description: Completed episode package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeCompletionResponse"
  /studio/ai/draft:
    post:
      operationId: generateSceneDraft
      tags: [ai]
      summary: Generate a family-friendly scene draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiScenePrompt"
      responses:
        "200":
          description: Generated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTextResult"
  /studio/ai/check:
    post:
      operationId: checkSceneContent
      tags: [ai]
      summary: Check scene content for young-audience fit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiContentCheckInput"
      responses:
        "200":
          description: Content check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentCheckResult"
  /studio/ai/director-notes:
    post:
      operationId: generateDirectorNotes
      tags: [ai]
      summary: Generate directing notes for a scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiDirectorPrompt"
      responses:
        "200":
          description: Director notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTextResult"
  /studio/ai/shot-suggestions:
    post:
      operationId: suggestShots
      tags: [ai]
      summary: Suggest shots for an emotional beat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiShotPrompt"
      responses:
        "200":
          description: Shot suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShotSuggestion"
  /studio/ai/faith-question:
    post:
      operationId: generateFaithQuestionStory
      tags: [ai]
      summary: Turn a difficult faith question into an age-aware story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaithQuestionInput"
      responses:
        "200":
          description: Bible-grounded answer and story material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaithQuestionStory"
  /studio/generation/shots:
    post:
      operationId: generateShotClip
      tags: [studio]
      summary: Submit a shot to the configured video provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotGenerationInput"
      responses:
        "202":
          description: Video generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    StudioExportPreflight:
      type: object
      required: [canQueue, message, cards, playbackSeconds, cardLimit, playbackLimitSeconds]
      properties:
        canQueue: { type: boolean }
        message: { type: string }
        cards: { type: ["integer", "null"] }
        playbackSeconds: { type: ["number", "null"] }
        cardLimit: { type: integer }
        playbackLimitSeconds: { type: integer }
    StudioExportInput:
      type: object
      required: [episodeId, aspectRatio, quality]
      properties:
        episodeId: { type: ["integer", "null"], minimum: 1 }
        aspectRatio: { type: string, enum: ["16:9", "9:16"] }
        quality: { type: string, enum: ["720p", "1080p"] }
    StudioExport:
      type: object
      required: [id, episodeId, aspectRatio, quality, status, progress, url, sizeBytes, error, createdAt]
      properties:
        id: { type: integer }
        episodeId: { type: ["integer", "null"] }
        aspectRatio: { type: string, enum: ["16:9", "9:16"] }
        quality: { type: string, enum: ["720p", "1080p"] }
        status: { type: string, enum: [queued, rendering, ready, failed, cancelled] }
        progress: { type: integer }
        url: { type: ["string", "null"] }
        sizeBytes:
          type: ["integer", "null"]
          minimum: 0
          maximum: 9007199254740991
          description: Completed MP4 size in bytes. Null for historical exports without recorded sizes and exports without a saved movie.
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      properties:
        error: { type: string }
      required: [error]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
      required: [id, email, firstName, lastName, profileImageUrl]
    UploadUrlRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath, metadata]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        logline: { type: string }
        audience: { type: string }
        seasonLabel: { type: string }
        activeEpisodeId: { type: integer }
      required: [id, title, logline, audience, seasonLabel, activeEpisodeId]
    ProjectUpdate:
      type: object
      properties:
        title: { type: string }
        logline: { type: string }
        audience: { type: string }
        seasonLabel: { type: string }
        activeEpisodeId: { type: integer }
    Character:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        role: { type: string }
        personality: { type: string }
        arc: { type: string }
        faithLesson: { type: string }
        visualNotes: { type: string }
        referenceImageUrl: { type: ["string", "null"] }
      required: [id, projectId, name, role, personality, arc, faithLesson, visualNotes, referenceImageUrl]
    CharacterInput:
      type: object
      required: [name, role, personality, arc, faithLesson, visualNotes]
      properties:
        name: { type: string }
        role: { type: string }
        personality: { type: string }
        arc: { type: string }
        faithLesson: { type: string }
        visualNotes: { type: string }
        referenceImageUrl: { type: ["string", "null"] }
    CharacterUpdate:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        personality: { type: string }
        arc: { type: string }
        faithLesson: { type: string }
        visualNotes: { type: string }
        referenceImageUrl: { type: ["string", "null"] }
    Episode:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        number: { type: integer }
        title: { type: string }
        summary: { type: string }
        status: { type: string, enum: [scripting, storyboarding, generating, done] }
        progress: { type: integer }
        duration: { type: string }
      required: [id, projectId, number, title, summary, status, progress, duration]
    Scene:
      type: object
      properties:
        id: { type: integer }
        episodeId: { type: integer }
        number: { type: integer }
        heading: { type: string }
        synopsis: { type: string }
        content: { type: string }
        status: { type: string, enum: [draft, review, locked] }
        duration: { type: string }
      required: [id, episodeId, number, heading, synopsis, content, status, duration]
    SceneInput:
      type: object
      properties:
        episodeId: { type: integer }
        heading: { type: string, minLength: 1 }
        synopsis: { type: string }
        content: { type: string }
        duration: { type: string }
      required: [episodeId, heading, synopsis, content]
    SceneUpdate:
      type: object
      properties:
        heading: { type: string, minLength: 1 }
        synopsis: { type: string }
        content: { type: string }
        duration: { type: string }
    Shot:
      type: object
      properties:
        id: { type: integer }
        sceneId: { type: integer }
        number: { type: integer }
        description: { type: string }
        shotType: { type: string }
        movement: { type: string }
        angle: { type: string }
        beat: { type: string }
        duration: { type: string }
        referenceImageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [planned, queued, generating, ready] }
      required: [id, sceneId, number, description, shotType, movement, angle, beat, duration, referenceImageUrl, status]
    ShotInput:
      type: object
      properties:
        sceneId: { type: integer }
        description: { type: string, minLength: 1 }
        shotType: { type: string }
        movement: { type: string }
        angle: { type: string }
        beat: { type: string }
        duration: { type: string }
      required: [sceneId, description, shotType, movement, angle, beat, duration]
    ShotUpdate:
      type: object
      properties:
        description: { type: string, minLength: 1 }
        shotType: { type: string }
        movement: { type: string }
        angle: { type: string }
        beat: { type: string }
        duration: { type: string }
    ShotOrderInput:
      type: object
      properties:
        sceneId: { type: integer }
        shotIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer }
      required: [sceneId, shotIds]
    EpisodeCompletionInput:
      type: object
      properties:
        ageBand: { type: string, enum: ["5-8", "9-12", "13-17"] }
      required: [ageBand]
    EpisodeCompletionResponse:
      type: object
      properties:
        episodeId: { type: integer }
        scenes:
          type: array
          items: { $ref: "#/components/schemas/Scene" }
        shots:
          type: array
          items: { $ref: "#/components/schemas/Shot" }
      required: [episodeId, scenes, shots]
    EpisodeVideoIssue:
      type: object
      properties:
        clipId: { type: integer }
        provider: { type: string }
        reason: { type: string }
      required: [clipId, provider, reason]
    EpisodeVideoUnavailable:
      type: object
      properties:
        error: { type: string }
        usedClipIds:
          type: array
          items: { type: integer }
        skippedClips:
          type: array
          items: { $ref: "#/components/schemas/EpisodeVideoIssue" }
      required: [error, usedClipIds, skippedClips]
    Clip:
      type: object
      properties:
        id: { type: integer }
        shotId: { type: integer }
        provider: { type: string }
        status: { type: string, enum: [queued, generating, ready, failed] }
        url: { type: ["string", "null"] }
        thumbnailUrl: { type: ["string", "null"] }
        duration: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, shotId, provider, status, url, thumbnailUrl, duration, createdAt]
    StudioBootstrap:
      type: object
      properties:
        project: { $ref: "#/components/schemas/Project" }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Episode" }
        scenes:
          type: array
          items: { $ref: "#/components/schemas/Scene" }
        characters:
          type: array
          items: { $ref: "#/components/schemas/Character" }
        shots:
          type: array
          items: { $ref: "#/components/schemas/Shot" }
        clips:
          type: array
          items: { $ref: "#/components/schemas/Clip" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/StudioAsset" }
      required: [project, episodes, scenes, characters, shots, clips, assets]
    StudioAsset:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        episodeId: { type: ["integer", "null"] }
        sceneId: { type: ["integer", "null"] }
        characterId: { type: ["integer", "null"] }
        kind: { type: string, enum: [storyboard, character-reference] }
        objectPath: { type: string }
        name: { type: string }
        contentType: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, episodeId, sceneId, characterId, kind, objectPath, name, contentType, createdAt]
    StudioAssetInput:
      type: object
      properties:
        episodeId: { type: ["integer", "null"] }
        sceneId: { type: ["integer", "null"] }
        characterId: { type: ["integer", "null"] }
        kind: { type: string, enum: [storyboard, character-reference] }
        objectPath: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        contentType: { type: string, minLength: 1 }
      required: [kind, objectPath, name, contentType]
    AiScenePrompt:
      type: object
      required: [premise, characters, tone]
      properties:
        premise: { type: string }
        characters: { type: string }
        tone: { type: string }
    AiContentCheckInput:
      type: object
      required: [content]
      properties:
        content: { type: string }
    AiDirectorPrompt:
      type: object
      required: [scene, emotionalBeat]
      properties:
        scene: { type: string }
        emotionalBeat: { type: string }
    AiShotPrompt:
      type: object
      required: [scene, emotionalBeat]
      properties:
        scene: { type: string }
        emotionalBeat: { type: string }
    AiTextResult:
      type: object
      properties:
        text: { type: string }
        provider: { type: string }
      required: [text, provider]
    ContentCheckResult:
      type: object
      properties:
        score: { type: integer }
        label: { type: string }
        flags:
          type: array
          items: { type: string }
        suggestions:
          type: array
          items: { type: string }
      required: [score, label, flags, suggestions]
    ShotSuggestion:
      type: object
      properties:
        shotType: { type: string }
        movement: { type: string }
